services:
  bot:
    build: .
    container_name: feed-tgbot
    env_file: .env
    restart: unless-stopped
    environment:
      TZ: ${TZ:-UTC}
    stop_grace_period: 20s
    healthcheck:
      test: ["CMD-SHELL", "tr '\\0' ' ' </proc/1/cmdline | grep -q feed-tgbot"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    volumes:
      - bot_data:/app

volumes:
  bot_data:
